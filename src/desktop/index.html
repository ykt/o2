<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>o2</title><style>
:root{font-family:Inter,Geist,-apple-system,BlinkMacSystemFont,sans-serif;color:#e8efea;background:#0b100d}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% -10%,#17241d,#0b100d 62%);color:#e8efea}button,input{font:inherit}button{cursor:pointer}#app{width:760px;max-width:calc(100vw - 30px);margin:70px auto 0;border-radius:18px;overflow:hidden;background:rgba(16,23,19,.86);backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.09);box-shadow:0 40px 90px -20px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.4);animation:o2in .34s cubic-bezier(.2,.9,.25,1)}@keyframes o2in{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}.bar{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.07)}.brand{font:600 34px/1 Inter,sans-serif;letter-spacing:-.045em;color:#7cc3a2}.mode{margin-left:auto;font:11px 'SF Mono',monospace;color:rgba(232,239,234,.32);text-transform:uppercase}.query{flex:1;min-width:0;font:400 26px/1.2 Inter,sans-serif;letter-spacing:-.015em;background:transparent;border:0;outline:0;color:#f0f5f2;caret-color:#7cc3a2}.query::placeholder{color:rgba(232,239,234,.3)}#scroll{max-height:430px;overflow:auto;padding:0 8px 8px}#scroll::-webkit-scrollbar{width:8px}#scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}.group{display:flex;align-items:baseline;gap:10px;padding:14px 10px 7px;font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(232,239,234,.34)}.group hr{flex:1;border:0;border-top:1px solid rgba(255,255,255,.055)}.row{height:58px;display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:12px;animation:o2row .18s ease;cursor:pointer}.row:hover,.row.selected{background:rgba(255,255,255,.075);box-shadow:inset 3px 0 0 -1px #7cc3a2}.tile{width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;border-radius:10px;font-weight:600;color:#fff;background:rgba(124,195,162,.12);border:1px solid rgba(124,195,162,.18)}.label{min-width:0;flex:1}.title,.subtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{font-size:15.5px;font-weight:450}.subtitle{font-size:12.5px;color:rgba(232,239,234,.45);margin-top:3px}.hint{font:400 11px 'SF Mono',monospace;color:rgba(232,239,234,.22);white-space:nowrap}.row.selected .hint{color:rgba(232,239,234,.6)}.empty{padding:44px 24px 48px;text-align:center;color:rgba(232,239,234,.6)}.empty small{display:block;color:rgba(232,239,234,.34);margin-top:8px}.footer{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;height:46px;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.18);font:11px 'SF Mono',monospace;color:rgba(232,239,234,.32)}.config-button{border:0;background:transparent;color:rgba(232,239,234,.45);padding:5px 8px;border-radius:7px;font:11.5px 'SF Mono',monospace}.config-button:hover{background:rgba(255,255,255,.06);color:rgba(232,239,234,.8)}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#7cc3a2;box-shadow:0 0 10px #7cc3a2;margin-right:8px}.status{white-space:nowrap}.peek{display:none;width:760px;max-width:calc(100vw - 30px);margin:12px auto 0;border:1px solid rgba(255,255,255,.09);border-radius:14px;overflow:hidden;background:rgba(16,23,19,.96)}.peek.open{display:block}.peek-head{display:flex;justify-content:space-between;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.07)}.peek-head small{display:block;color:rgba(232,239,234,.4);margin-top:3px}.peek-actions button{border:1px solid rgba(124,195,162,.35);background:rgba(124,195,162,.12);color:#7cc3a2;padding:7px 12px;border-radius:8px;margin-left:6px}.peek pre{margin:0;padding:16px 18px 20px;font:12px/1.85 'SF Mono',monospace;color:rgba(232,239,234,.55);overflow:auto;max-height:300px}.large{display:none;position:fixed;z-index:50;inset:0;align-items:center;justify-content:center;flex-direction:column;background:rgba(6,10,8,.93);backdrop-filter:blur(24px);text-align:center}.large.open{display:flex}.large-text{font-size:clamp(56px,14vw,180px);font-weight:300;letter-spacing:-.035em;overflow-wrap:anywhere;max-width:95vw}.large small{font:12px 'SF Mono',monospace;color:rgba(243,248,245,.32);margin-top:20px}@media(max-width:600px){#app{margin-top:18px}.mode{display:none}.footer{font-size:10px}.status{display:none}}
</style></head>
<body><div id="app"><header class="bar"><span class="brand">o2</span><input id="query" class="query" aria-label="Search apps, run a workflow, do math" autofocus placeholder="Search apps, run a workflow, do math" spellcheck="false" autocomplete="off"><span id="mode" class="mode"></span></header><div id="scroll"><div id="results" role="listbox"></div></div><footer class="footer"><button id="config-button" class="config-button"><span class="dot"></span>~/.config/o2/config.json</button><span id="status" class="status">Ready · ⏎ run · ⌘L large · ⌘, config</span></footer></div><section id="peek" class="peek"><div class="peek-head"><div><b>config.json</b><small id="peek-meta">validated · read-only here</small></div><div class="peek-actions"><button id="open-editor">Open in editor</button><button id="close-peek">Close</button></div></div><pre id="peek-json"></pre></section><section id="large" class="large"><div id="large-text" class="large-text"></div><small>esc or click to dismiss</small></section><script src="renderer.js"></script></body>
