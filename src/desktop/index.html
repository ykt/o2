<!doctype html>
<html>
<head><meta charset="utf-8"><title>o2</title><style>
body{font:14px system-ui;margin:0;background:#17181c;color:#eee}main{padding:18px}input{box-sizing:border-box;width:100%;font-size:24px;padding:12px;background:#252832;border:1px solid #454957;color:#fff;border-radius:8px}ul{list-style:none;padding:8px 0;margin:0}li{padding:12px;border-radius:6px}li.selected{background:#2e765f}.state{color:#9aa0ad;padding:14px}
</style></head>
<body><main><input id="query" autofocus placeholder="Search apps, calculate, or run an o2 workflow"><ul id="results"></ul><div id="state" class="state">Type to search</div></main>
<script>const q=document.querySelector('#query'),list=document.querySelector('#results'),state=document.querySelector('#state');let selected=0,items=[];async function render(){items=await window.launcher.search(q.value);selected=Math.min(selected,Math.max(0,items.length-1));list.innerHTML=items.map((x,i)=>`<li class="${i===selected?'selected':''}">${x.name}<small style="display:block;color:#aab">${x.path}</small></li>`).join('');state.textContent=items.length?'Enter to open':'No matching applications'}q.addEventListener('input',render);q.addEventListener('keydown',async e=>{if(e.key==='ArrowDown'){selected=Math.min(selected+1,items.length-1);render()}if(e.key==='ArrowUp'){selected=Math.max(selected-1,0);render()}if(e.key==='Escape'){window.close()}if(e.key==='Enter'){state.textContent='Running…';try{const out=await window.launcher.execute(q.value);state.textContent=out.output||'Done'}catch(err){state.textContent=err.message}}});</script></body>
</html>
